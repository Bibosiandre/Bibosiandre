name: GitHub Metrics

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  generate-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      # 1. Профиль, активность и статистика сообщества
      - name: Generate overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-overview.svg

          template: classic
          base: header, activity, community

          repositories_forks: no
          config_timezone: Europe/Riga

          output_action: none
          plugins_errors_fatal: yes

      # 2. Основные языки
      - name: Generate languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-languages.svg

          template: classic
          base: ""

          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_other: yes

          repositories_forks: no

          output_action: none
          plugins_errors_fatal: yes

      # 3. Два выбранных проекта
      - name: Generate featured repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-repositories.svg

          template: classic
          base: ""

          plugin_repositories: yes
          plugin_repositories_featured: Bibosiandre/Z-image_AI_Generator_Tkinter,Bibosiandre/Metall_APP_ISO-GOST_bot
          plugin_repositories_forks: no

          output_action: none
          plugins_errors_fatal: yes

      # 4. Календарь коммитов
      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-calendar.svg

          template: classic
          base: ""

          plugin_calendar: yes
          plugin_calendar_limit: 1

          output_action: none
          plugins_errors_fatal: yes

      # Не разрешаем workflow завершиться успешно,
      # если хотя бы одна карточка не была создана
      - name: Verify generated files
        shell: bash
        run: |
          files=(
            "metrics-overview.svg"
            "metrics-languages.svg"
            "metrics-repositories.svg"
            "metrics-calendar.svg"
          )

          for file in "${files[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::File $file was not generated"
              exit 1
            fi

            echo "Generated: $file"
          done

      # Коммитим все четыре карточки одновременно
      - name: Commit generated metrics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            metrics-overview.svg \
            metrics-languages.svg \
            metrics-repositories.svg \
            metrics-calendar.svg

          if git diff --cached --quiet; then
            echo "Metrics have not changed"
            exit 0
          fi

          git commit -m "Update GitHub metrics"
          git push
