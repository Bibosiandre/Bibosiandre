name: GitHub Metrics

on:
  workflow_dispatch:

  schedule:
    # Обновление каждый день в 03:00 UTC
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest

    steps:
      # 1. Общая информация и статистика
      - name: Generate overview
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-overview.svg

          template: classic
          base: header, activity, community, repositories
          base_indepth: yes

          repositories_forks: no
          config_timezone: Europe/Riga
          plugins_errors_fatal: yes

      # 2. Используемые языки
      - name: Generate languages
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-languages.svg

          template: classic
          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%
          plugin_languages_other: yes

          repositories_forks: no
          plugins_errors_fatal: yes

      # 3. Время и привычки программирования
      - name: Generate coding habits
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-habits.svg

          template: classic
          base: ""

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes

          config_timezone: Europe/Riga
          plugins_errors_fatal: yes

      # 4. Календарь активности
      - name: Generate contribution calendar
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Bibosiandre
          filename: metrics-calendar.svg

          template: classic
          base: ""

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugins_errors_fatal: yes
